<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mirada">
  <!--
    Family resemblance to Editora, Termina and Torrenta: the same Ink navy tile, the same corner
    radius, the same teal gradient, and the same two-tone split — a muted periwinkle framing glyph
    with the teal reserved for the focal element.

    Termina pairs a prompt chevron with a block cursor because it is a terminal; Torrenta drops an
    arrow into a tray because it downloads. Mirada ("gaze") frames a teal iris in a periwinkle eye
    because it is for looking.

    Two shapes only, so it still reads at 32px: at that size the eye is an outline and the iris a dot.
  -->
  <defs>
    <linearGradient id="caretF" x1="256" y1="198" x2="256" y2="314" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22B8A6"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="#1B1E2A"/>

  <!-- The eye: two arcs meeting in points at either side, open around the iris. -->
  <path d="M110 256 Q256 120 402 256 Q256 392 110 256 Z"
        fill="none" stroke="#9AA2D4" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="256" cy="256" r="58" fill="url(#caretF)"/>
</svg>
