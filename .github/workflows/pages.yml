name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # A run on master is never canceled while it runs. GitHub still cancels a run that is waiting in this group when a
  # newer one queues, so a quick merge can skip a release's run. The next run publishes it anyway: the current edition
  # from its release commit when the batch after it is pending (scripts/release-state.mjs), and any older one from its
  # commit (scripts/missing-editions.mjs).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds and checks everything with a read-only token: npm's install scripts and the build never hold write access.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.state.outputs.publish }}
      base: ${{ steps.state.outputs.base }}
      site: ${{ steps.state.outputs.site }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the edition check compares with the base commit and the tags
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Decide what to publish
        # The site: latest/ and <version>/ from HEAD when [Unreleased] is empty, else from the last commit before the
        # batch began (the commit that released the current edition, or a later one that changed only the site),
        # with next/ from HEAD. What to tag and archive: HEAD when [Unreleased] is empty (the commit
        # that released the edition, if an earlier push did and it was never tagged), else the current edition if it
        # isn't tagged and live yet, else nothing (scripts/release-state.mjs). Only a run on master publishes or
        # deploys: a pull request, or a manual run on any other branch or tag, skips this step, so `publish`, `site`
        # and `next` stay empty and the run checks and builds its own checkout; a pull request then also builds what
        # master will (the step "Rehearse the build of the released edition").
        id: state
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          node scripts/release-state.mjs > "$RUNNER_TEMP/state"
          cat "$RUNNER_TEMP/state"
          grep -Eq '^pending=(true|false)$' "$RUNNER_TEMP/state" || { echo "release-state printed no pending=true|false" >&2; exit 1; }
          cat "$RUNNER_TEMP/state" >> "$GITHUB_OUTPUT"
      - name: Check the edition
        # Guidance under [Unreleased], or a release numbered above master's and every tag (scripts/check-edition.mjs),
        # for this commit. A release commit that already carries its own v<version> tag passed this check when it was
        # merged and tagged; it is only being published again (its deploy failed). A manual run on another branch is
        # checked like a pull request: against the commit where it left master.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUBLISH: ${{ steps.state.outputs.publish }}
          PUBLISH_BASE: ${{ steps.state.outputs.base }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="origin/$PR_BASE"
          elif [ "$REF" != refs/heads/master ]; then base="$(git merge-base origin/master HEAD)"
          elif [ -n "$PUBLISH" ] && [ "$PUBLISH" = "$(git rev-parse HEAD)" ]; then base="$PUBLISH_BASE"
          elif [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ]; then base="$BEFORE"
          else base="HEAD^1"; fi
          version=$(node -p 'require("./package.json").version')
          if [ "$EVENT" != pull_request ] && [ "$(git rev-parse -q --verify "refs/tags/v$version^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "v$version is tagged at this commit: it passed the edition check when it was released"
            exit 0
          fi
          node scripts/check-edition.mjs "$base"
      - name: Install dependencies
        run: npm ci
      - name: Install pandoc
        # From pandoc's own GitHub release, not apt: the runner's apt mirror has hung for over six minutes. The checksum
        # is the release file's as first downloaded; change both together.
        timeout-minutes: 3
        env:
          PANDOC_VERSION: 3.6.4
          PANDOC_SHA256: 68e5516a5464b12354146e9e23bc41a4c05f302f4ba5def9bdc49f1e2db0d1e0
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  $RUNNER_TEMP/pandoc.deb" | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -1
      - name: Build next/ from this commit
        # The batch under [Unreleased], before the checkout moves to the commit that released the current edition
        # (scripts/build-next.mjs). Without a batch, or on a pull request, scripts/build-site.mjs handles next/ itself.
        if: steps.state.outputs.next != ''
        run: |
          node scripts/check-rules.mjs
          node scripts/build-next.mjs --build "$RUNNER_TEMP/next"
      - name: Build the family appendix from this commit
        # The feature matrix, shared features and gaps per app, in no edition (scripts/build-appendix.mjs): always
        # this commit's, before the checkout moves to the commit that released the current edition, so a change to
        # them is live at the next merge without a release. The site build places it at family/ (PAUTA_APPENDIX).
        run: |
          node scripts/check-rules.mjs
          node scripts/build-appendix.mjs --build "$RUNNER_TEMP/family"
      - name: Keep this run's scripts
        # scripts/ and the libraries they import (src/lib), as this run's commit has them, outside the checkout. Every
        # step from here on runs them from there, on the checkout (PAUTA_ROOT): when the checkout moves to the commit
        # that released the current edition (next step), the build, the checks and the downloads are still master's,
        # so a fix to them made after the release applies. Nothing else is copied, so a script that looked for the
        # tree beside itself would find no package.json and fail. What stays the checkout's own: its pages and src/
        # as Astro reads them, package.json, CHANGELOG.md, pins.json, node_modules, and scripts/check-rules.mjs
        # (scripts/build-site.mjs says why). An older edition a canceled run skipped is still built by its own
        # scripts, in its own worktree (scripts/build-edition.sh). A pull request keeps its scripts here too, and so
        # runs the copies; but its checkout never moves in the steps below (it has no `site`), so they build its own
        # tree. What master does with them, building the released edition's tree, a pull request does in the step
        # "Rehearse the build of the released edition", further down.
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/tools"
          git archive "$RUN_SHA" scripts src/lib | tar -x -C "$RUNNER_TEMP/tools"
          test -f "$RUNNER_TEMP/tools/scripts/build-site.mjs"
      - name: Switch to the released edition
        # latest/ and <version>/ are the edition as released, with that commit's own packages. Its own copy of
        # scripts/ is not run again, but for scripts/check-rules.mjs.
        if: steps.state.outputs.site != '' && steps.state.outputs.site != github.sha
        env:
          SITE: ${{ steps.state.outputs.site }}
        run: |
          rm -rf dist build public/downloads
          git checkout --quiet --detach "$SITE"
          npm ci
      - name: Check the edition published again
        # The current edition, published from its release commit because its own run was canceled or failed: checked
        # against the commit before it, as when it was released, unless it already carries its tag. The checkout is
        # at that commit when a batch waits (the step above). When none does, the site is built from HEAD and the
        # release commit is an earlier push: it is checked in a worktree of its own, since the check reads the
        # files of the commit it is on.
        if: steps.state.outputs.publish != '' && steps.state.outputs.publish != github.sha
        env:
          PUBLISH: ${{ steps.state.outputs.publish }}
          PUBLISH_BASE: ${{ steps.state.outputs.base }}
          TOOLS: ${{ runner.temp }}/tools/scripts
        run: |
          root=$GITHUB_WORKSPACE
          if [ "$(git rev-parse HEAD)" != "$PUBLISH" ]; then
            root=$RUNNER_TEMP/released
            git worktree add --quiet --detach "$root" "$PUBLISH"
          fi
          version=$(cd "$root" && node -p 'require("./package.json").version')
          if [ "$(git rev-parse -q --verify "refs/tags/v$version^{commit}")" = "$PUBLISH" ]; then
            echo "v$version is tagged at this commit: it passed the edition check when it was released"
          else
            PAUTA_ROOT=$root node "$TOOLS/check-edition.mjs" "$PUBLISH_BASE"
          fi
          if [ "$root" != "$GITHUB_WORKSPACE" ]; then git worktree remove --force "$root"; fi
      - name: Read the version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Build the PDF and Markdown downloads
        env:
          PAUTA_ROOT: ${{ github.workspace }}
          TOOLS: ${{ runner.temp }}/tools/scripts
        run: bash "$TOOLS/build-print.sh"
      - name: Rebuild editions a canceled run never archived
        # Usually none. Each one is built from the commit that released it, served with this deploy, and archived by
        # the publish job, so only a run that publishes (or a pull request, as a check) rebuilds them.
        # The list stays in build/editions/ so the artifact below always keeps its dist/ and build/ paths.
        if: github.event_name == 'pull_request' || steps.state.outputs.publish != ''
        env:
          PAUTA_ROOT: ${{ github.workspace }}
          TOOLS: ${{ runner.temp }}/tools/scripts
        run: |
          mkdir -p build/editions
          node "$TOOLS/missing-editions.mjs" > build/editions/missing.txt
          # The build reads nothing from standard input, and is given none: the loop's input is the list, and a
          # program in the edition's own build (its npm packages, its scripts) that read it would swallow the
          # editions still to come, which would then be skipped without a word.
          while read -r version commit; do
            bash "$TOOLS/build-edition.sh" "$version" "$commit" < /dev/null
          done < build/editions/missing.txt
      - name: Build the site
        # scripts/build-site.mjs (`npm run build`, run here as this run's copy): every edition in its folder, with
        # the PDF of the two newest only (scripts/trim-pdfs.mjs). In CI it fails when an edition or a download is
        # missing.
        env:
          PAUTA_ROOT: ${{ github.workspace }}
          PAUTA_APPENDIX: ${{ runner.temp }}/family
          TOOLS: ${{ runner.temp }}/tools/scripts
        run: node "$TOOLS/build-site.mjs"
      - name: Add next/
        # The batch built above, in place of the redirects the build of a release commit leaves at next/.
        if: steps.state.outputs.next != ''
        env:
          TOOLS: ${{ runner.temp }}/tools/scripts
        run: node "$TOOLS/build-next.mjs" --add "$RUNNER_TEMP/next" dist
      - name: Rehearse the build of the released edition
        # A pull request only: what a run on master does while a batch waits under [Unreleased], which the steps
        # above never do here. Master then builds latest/ and <version>/ from the last commit before the batch
        # began, the commit that released the current edition or a later site-only one, with the scripts of the
        # commit it runs on; a change to scripts/ or src/lib would otherwise first meet that older tree on master,
        # where a failure stops every deploy. So the checkout moves to that commit
        # (as "Switch to the released edition" moves it), and this pull request's copies of the scripts build its
        # downloads and its site, then add the next/ built above. Nothing here is uploaded, tagged or deployed: the
        # steps below and the jobs after this one are skipped on a pull request as before. When nothing waits (the
        # pull request is itself the release, or leaves [Unreleased] empty), master builds from HEAD, as the steps
        # above just did. The editions a canceled run never archived were rebuilt above with these same scripts, and
        # are kept for this build.
        if: github.event_name == 'pull_request'
        env:
          PAUTA_ROOT: ${{ github.workspace }}
          PAUTA_APPENDIX: ${{ runner.temp }}/family
          TOOLS: ${{ runner.temp }}/tools/scripts
        run: |
          site=$(node scripts/release-state.mjs --site)
          if [ "$site" = "$(git rev-parse HEAD)" ]; then
            echo "nothing waits under [Unreleased]: master builds this commit, as the steps above did"
            exit 0
          fi
          echo "master builds latest/ from $site; building it with this pull request's scripts"
          rm -rf "$RUNNER_TEMP/rehearsal"
          mkdir "$RUNNER_TEMP/rehearsal"
          mv dist/next "$RUNNER_TEMP/rehearsal/next"
          if [ -d build/editions ]; then mv build/editions "$RUNNER_TEMP/rehearsal/editions"; fi
          rm -rf dist build public/downloads
          git checkout --quiet --detach "$site"
          npm ci
          if [ -d "$RUNNER_TEMP/rehearsal/editions" ]; then mkdir build && mv "$RUNNER_TEMP/rehearsal/editions" build/editions; fi
          bash "$TOOLS/build-print.sh"
          node "$TOOLS/build-site.mjs"
          node "$TOOLS/build-next.mjs" --add "$RUNNER_TEMP/rehearsal/next" dist
      - name: Upload the site for Pages
        if: steps.state.outputs.site != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Upload the editions to archive
        if: steps.state.outputs.publish != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editions
          path: |
            dist/${{ steps.version.outputs.version }}
            build/editions
          if-no-files-found: error
          retention-days: 1

  # Tags the edition and keeps it on the versions branch. The one job that can write to the repository; it installs
  # nothing and runs only this repository's scripts: this run's own (master's, as in the build job), on the checkout of
  # the commit the build job published. On master only: the build job already leaves `publish` empty anywhere else,
  # and this job tests the ref itself rather than trust that output.
  publish:
    if: github.ref == 'refs/heads/master' && needs.build.outputs.publish != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out the published commit
        env:
          PUBLISH: ${{ needs.build.outputs.publish }}
        run: git checkout --quiet --detach "$PUBLISH"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download the built editions
        # Outside the checkout, so nothing the build job uploaded can replace a script this job runs.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: editions
          path: ${{ runner.temp }}/editions
      - name: Check what was downloaded
        # Only edition folders, named by their versions: dist/<version>/ and build/editions/<version>/.
        env:
          EDITIONS: ${{ runner.temp }}/editions
        run: |
          stray=$(cd "$EDITIONS" && find . -mindepth 1 -maxdepth 3 -type d | grep -vxE '\./(dist|build|build/editions)|\./(dist|build/editions)/[0-9]+\.[0-9]+\.[0-9]+|\./(dist|build/editions)/[0-9]+\.[0-9]+\.[0-9]+/[^/]+' || true)
          [ -z "$stray" ] || { echo "unexpected paths in the editions artifact:" >&2; echo "$stray" >&2; exit 1; }
      - name: Keep this run's scripts
        # As in the build job: scripts/ and src/lib of this run's commit, read from git and so from nothing the build
        # job uploaded, into a folder that must not exist yet. Usually they are the checkout's own; when the edition
        # is published again from its release commit, they are master's, which tags and archives as master does now.
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          mkdir "$RUNNER_TEMP/tools"
          git archive "$RUN_SHA" scripts src/lib | tar -x -C "$RUNNER_TEMP/tools"
          test -f "$RUNNER_TEMP/tools/scripts/archive-edition.sh"
      - name: Tag the editions and keep them on the versions branch
        # Only CI tags: v<version> once, on the commit that released it, which a run on a later commit is not on
        # (scripts/check-edition.mjs --tag), and any older edition a canceled run left untagged, at the commit that
        # released it (scripts/missing-editions.mjs --tag).
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          VERSION: ${{ needs.build.outputs.version }}
          BASE: ${{ needs.build.outputs.base }}
          EDITIONS: ${{ runner.temp }}/editions
          PAUTA_ROOT: ${{ github.workspace }}
          TOOLS: ${{ runner.temp }}/tools/scripts
        run: |
          node "$TOOLS/check-edition.mjs" --tag "$BASE"
          node "$TOOLS/missing-editions.mjs" --tag
          shopt -s nullglob
          bash "$TOOLS/archive-edition.sh" --push "$EDITIONS/dist/${VERSION}" "$EDITIONS"/build/editions/[0-9]*

  deploy:
    # Every run on master deploys, and no other run does: the current edition, and next/ while a batch waits. When the
    # run publishes an edition, only after the publish job succeeded, so the edition is tagged and archived before it
    # goes live.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && needs.build.result == 'success' && needs.build.outputs.site != '' && (needs.publish.result == 'success' || (needs.build.outputs.publish == '' && needs.publish.result == 'skipped')) }}
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # The most the action waits (it caps anything higher at ten minutes). Pages sometimes syncs longer, and the
          # action then cancels the deployment, which can't be re-run under the same ID (the commit SHA). The next
          # push to master publishes it again: scripts/release-state.mjs republishes an edition that isn't live.
          timeout: 600000
