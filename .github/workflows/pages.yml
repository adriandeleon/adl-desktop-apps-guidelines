name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # A run on master is never canceled while it runs. GitHub still cancels a run that is waiting in this group when a
  # newer one queues, so a quick merge can skip a release's run. The next run publishes it anyway: the current edition
  # from its release commit when the batch after it is pending (scripts/release-state.mjs), and any older one from its
  # commit (scripts/missing-editions.mjs).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds and checks everything with a read-only token: npm's install scripts and the build never hold write access.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.state.outputs.publish }}
      base: ${{ steps.state.outputs.base }}
      site: ${{ steps.state.outputs.site }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the edition check compares with the base commit and the tags
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Decide what to publish
        # The site: latest/ and <version>/ from HEAD when [Unreleased] is empty, else from the commit that released the
        # current edition, with next/ from HEAD. What to tag and archive: HEAD when [Unreleased] is empty, else the
        # current edition if it isn't tagged and live yet, else nothing (scripts/release-state.mjs). Only a run on
        # master publishes or deploys: a pull request, or a manual run on any other branch or tag, skips this step, so
        # `publish`, `site` and `next` stay empty and the run only checks and builds its own checkout.
        id: state
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          node scripts/release-state.mjs > "$RUNNER_TEMP/state"
          cat "$RUNNER_TEMP/state"
          grep -Eq '^pending=(true|false)$' "$RUNNER_TEMP/state" || { echo "release-state printed no pending=true|false" >&2; exit 1; }
          cat "$RUNNER_TEMP/state" >> "$GITHUB_OUTPUT"
      - name: Check the edition
        # Guidance under [Unreleased], or a release numbered above master's and every tag (scripts/check-edition.mjs),
        # for this commit. A release commit that already carries its own v<version> tag passed this check when it was
        # merged and tagged; it is only being published again (its deploy failed). A manual run on another branch is
        # checked like a pull request: against the commit where it left master.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUBLISH: ${{ steps.state.outputs.publish }}
          PUBLISH_BASE: ${{ steps.state.outputs.base }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="origin/$PR_BASE"
          elif [ "$REF" != refs/heads/master ]; then base="$(git merge-base origin/master HEAD)"
          elif [ -n "$PUBLISH" ] && [ "$PUBLISH" = "$(git rev-parse HEAD)" ]; then base="$PUBLISH_BASE"
          elif [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ]; then base="$BEFORE"
          else base="HEAD^1"; fi
          version=$(node -p 'require("./package.json").version')
          if [ "$EVENT" != pull_request ] && [ "$(git rev-parse -q --verify "refs/tags/v$version^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "v$version is tagged at this commit: it passed the edition check when it was released"
            exit 0
          fi
          node scripts/check-edition.mjs "$base"
      - name: Install dependencies
        run: npm ci
      - name: Install pandoc
        # From pandoc's own GitHub release, not apt: the runner's apt mirror has hung for over six minutes. The checksum
        # is the release file's as first downloaded; change both together.
        timeout-minutes: 3
        env:
          PANDOC_VERSION: 3.6.4
          PANDOC_SHA256: 68e5516a5464b12354146e9e23bc41a4c05f302f4ba5def9bdc49f1e2db0d1e0
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  $RUNNER_TEMP/pandoc.deb" | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -1
      - name: Build next/ from this commit
        # The batch under [Unreleased], before the checkout moves to the commit that released the current edition
        # (scripts/build-next.mjs). Without a batch, or on a pull request, scripts/build-site.mjs handles next/ itself.
        if: steps.state.outputs.next != ''
        run: |
          node scripts/check-rules.mjs
          node scripts/build-next.mjs --build "$RUNNER_TEMP/next"
      - name: Switch to the released edition
        # latest/ and <version>/ are the edition as released, with that commit's own packages.
        if: steps.state.outputs.site != '' && steps.state.outputs.site != github.sha
        env:
          SITE: ${{ steps.state.outputs.site }}
        run: |
          rm -rf dist build public/downloads
          git checkout --quiet --detach "$SITE"
          npm ci
      - name: Check the edition published again
        # The current edition, published from its release commit because its own run was canceled or failed: checked
        # against the commit before it, as when it was released, unless it already carries its tag.
        if: steps.state.outputs.publish != '' && steps.state.outputs.publish != github.sha
        env:
          PUBLISH_BASE: ${{ steps.state.outputs.base }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$(git rev-parse -q --verify "refs/tags/v$version^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "v$version is tagged at this commit: it passed the edition check when it was released"
            exit 0
          fi
          node scripts/check-edition.mjs "$PUBLISH_BASE"
      - name: Read the version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Build the PDF and Markdown downloads
        run: ./scripts/build-print.sh
      - name: Rebuild editions a canceled run never archived
        # Usually none. Each one is built from the commit that released it, served with this deploy, and archived by
        # the publish job, so only a run that publishes (or a pull request, as a check) rebuilds them.
        # The list stays in build/editions/ so the artifact below always keeps its dist/ and build/ paths.
        if: github.event_name == 'pull_request' || steps.state.outputs.publish != ''
        run: |
          mkdir -p build/editions
          node scripts/missing-editions.mjs > build/editions/missing.txt
          while read -r version commit; do
            ./scripts/build-edition.sh "$version" "$commit"
          done < build/editions/missing.txt
      - name: Build the site
        # scripts/build-site.mjs: every edition in its folder. In CI it fails when an edition or a download is missing.
        run: npm run build
      - name: Keep the PDFs of the two newest editions
        # master's copy of scripts/trim-pdfs.mjs, whichever commit this run builds: an edition published again from
        # its own release commit, whose build predates the script, gets the same trimmed site.
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          git show "$RUN_SHA:scripts/trim-pdfs.mjs" > "$RUNNER_TEMP/trim-pdfs.mjs"
          node "$RUNNER_TEMP/trim-pdfs.mjs" dist
      - name: Add next/
        # The batch built above, with master's copy of scripts/build-next.mjs: the release commit's build predates it
        # or holds redirects at next/.
        if: steps.state.outputs.next != ''
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          git show "$RUN_SHA:scripts/build-next.mjs" > "$RUNNER_TEMP/build-next.mjs"
          node "$RUNNER_TEMP/build-next.mjs" --add "$RUNNER_TEMP/next" dist
      - name: Upload the site for Pages
        if: steps.state.outputs.site != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Upload the editions to archive
        if: steps.state.outputs.publish != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editions
          path: |
            dist/${{ steps.version.outputs.version }}
            build/editions
          if-no-files-found: error
          retention-days: 1

  # Tags the edition and keeps it on the versions branch. The one job that can write to the repository; it installs
  # nothing and runs only this repository's scripts, at the commit the build job published. On master only: the build
  # job already leaves `publish` empty anywhere else, and this job tests the ref itself rather than trust that output.
  publish:
    if: github.ref == 'refs/heads/master' && needs.build.outputs.publish != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out the published commit
        env:
          PUBLISH: ${{ needs.build.outputs.publish }}
        run: git checkout --quiet --detach "$PUBLISH"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download the built editions
        # Outside the checkout, so nothing the build job uploaded can replace a script this job runs.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: editions
          path: ${{ runner.temp }}/editions
      - name: Check what was downloaded
        # Only edition folders, named by their versions: dist/<version>/ and build/editions/<version>/.
        env:
          EDITIONS: ${{ runner.temp }}/editions
        run: |
          stray=$(cd "$EDITIONS" && find . -mindepth 1 -maxdepth 3 -type d | grep -vxE '\./(dist|build|build/editions)|\./(dist|build/editions)/[0-9]+\.[0-9]+\.[0-9]+|\./(dist|build/editions)/[0-9]+\.[0-9]+\.[0-9]+/[^/]+' || true)
          [ -z "$stray" ] || { echo "unexpected paths in the editions artifact:" >&2; echo "$stray" >&2; exit 1; }
      - name: Tag the editions and keep them on the versions branch
        # Only CI tags: v<version> on master's commit, once (scripts/check-edition.mjs --tag), and any edition a
        # canceled run left untagged, at the commit that released it (scripts/missing-editions.mjs --tag).
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          VERSION: ${{ needs.build.outputs.version }}
          BASE: ${{ needs.build.outputs.base }}
          EDITIONS: ${{ runner.temp }}/editions
        run: |
          node scripts/check-edition.mjs --tag "$BASE"
          node scripts/missing-editions.mjs --tag
          shopt -s nullglob
          ./scripts/archive-edition.sh --push "$EDITIONS/dist/${VERSION}" "$EDITIONS"/build/editions/[0-9]*

  deploy:
    # Every run on master deploys, and no other run does: the current edition, and next/ while a batch waits. When the
    # run publishes an edition, only after the publish job succeeded, so the edition is tagged and archived before it
    # goes live.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && needs.build.result == 'success' && needs.build.outputs.site != '' && (needs.publish.result == 'success' || (needs.build.outputs.publish == '' && needs.publish.result == 'skipped')) }}
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # The most the action waits (it caps anything higher at ten minutes). Pages sometimes syncs longer, and the
          # action then cancels the deployment, which can't be re-run under the same ID (the commit SHA). The next
          # push to master publishes it again: scripts/release-state.mjs republishes an edition that isn't live.
          timeout: 600000
