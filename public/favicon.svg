<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pauta">
  <!--
    Family resemblance to Editora, Termina, Torrenta and Mirada: the same Ink navy tile, the same
    corner radius, the same teal gradient, and the same two-tone split, a muted periwinkle framing
    glyph with the teal reserved for the focal element.

    Pauta is Spanish for a guideline, and for the ruled lines on writing paper. Three periwinkle
    rules are the guide; the teal tick is an app checked against it. The middle rule is shorter so
    the tick has room to sit level with it.

    Two shapes only, so it still reads at 32px: three bars and a tick.

    The group is centred optically: the strokes' round caps reach 15px (rules) and 18px (tick) past
    their paths, so the paths run from 130 to 384 for ink from 115 to 402, and from 172 to 340 for
    ink from 157 to 355, the height of Editora's letterform.
  -->
  <defs>
    <linearGradient id="caretF" x1="256" y1="208" x2="256" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22B8A6"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="#1B1E2A"/>

  <g stroke="#9AA2D4" stroke-width="30" stroke-linecap="round">
    <path d="M130 172 H286"/>
    <path d="M130 256 H250"/>
    <path d="M130 340 H286"/>
  </g>

  <path d="M292 264 L332 304 L384 208"
        fill="none" stroke="url(#caretF)" stroke-width="36"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
