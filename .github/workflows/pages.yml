name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the versions branch, on a push to master
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pandoc
        # From pandoc's own GitHub release, not apt: the runner's apt mirror has hung for over six minutes.
        timeout-minutes: 3
        env:
          PANDOC_VERSION: 3.6.4
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -1
      - name: Build the PDF and Markdown downloads
        run: ./scripts/build-print.sh
      - name: Build the site and upload it
        # Runs `npm run build`: scripts/build-site.mjs, every edition in its folder (fetches the versions branch).
        uses: withastro/action@v6
        with:
          node-version: 24
      - name: Keep this edition on the versions branch
        if: github.event_name == 'push'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: ./scripts/archive-edition.sh --push

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages sometimes sits in "updating_pages" for over ten minutes (the action's default wait), and a
          # canceled deployment cannot be re-run: its ID is the commit SHA. Wait longer instead.
          timeout: 1200000
