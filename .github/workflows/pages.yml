name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pandoc
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq --no-install-recommends pandoc
      - name: Build the PDF and Markdown downloads
        run: ./scripts/build-print.sh
      - name: Build the site and upload it
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages sometimes sits in "updating_pages" for over ten minutes (the action's default wait), and a
          # cancelled deployment cannot be re-run: its ID is the commit SHA. Wait longer instead.
          timeout: 1200000
